name: Zee
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Zee.xcconfig
  Release: Config/Zee.xcconfig
options:
  bundleIdPrefix: dev.zee
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.1"
  xcodeVersion: "27.0"
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(ZEE_DEVELOPMENT_TEAM)"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      APS_ENVIRONMENT: development
      ICLOUD_CONTAINER_ENVIRONMENT: Development
    Release:
      APS_ENVIRONMENT: production
      ICLOUD_CONTAINER_ENVIRONMENT: Production
      SWIFT_COMPILATION_MODE: singlefile
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6
# App capabilities are declared by the entitlements files (iCloud, CloudKit,
# push) and Info.plist UIBackgroundModes. The legacy TargetAttributes
# SystemCapabilities blocks duplicated that, serialized in nondeterministic
# dictionary order, and churned project.pbxproj on every generate.
targetTemplates:
  PortableCoreMac:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/ZeeContracts/include"
        ZEE_CORE_LIBRARY_DIR: "$(BUILT_PRODUCTS_DIR)/ZeeCore"
        OTHER_LDFLAGS: '$(inherited) "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"'
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build portable core
        script: python3 "$SRCROOT/Scripts/control-plane/build-apple-core.py"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"
    postBuildScripts:
      - name: Embed portable core
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$ZEE_CORE_LIBRARY_DIR/ZeeCore.Native.dylib" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCore.Native.dylib"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCore.Native.dylib"
          fi
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/ZeeCore.Native.dylib"
  PortableCoreMobile:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/ZeeContracts/include"
        ZEE_CORE_FRAMEWORK_DIR: "$(BUILT_PRODUCTS_DIR)/ZeeCore"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(ZEE_CORE_FRAMEWORK_DIR)"
        OTHER_LDFLAGS: "$(inherited) -framework ZeeCoreABI"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build portable core
        script: python3 "$SRCROOT/Scripts/control-plane/build-apple-core.py"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(ZEE_CORE_FRAMEWORK_DIR)/ZeeCoreABI.framework/ZeeCoreABI"
    postBuildScripts:
      - name: Embed portable core
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          ditto "$ZEE_CORE_FRAMEWORK_DIR/ZeeCoreABI.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCoreABI.framework"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCoreABI.framework"
          fi
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(ZEE_CORE_FRAMEWORK_DIR)/ZeeCoreABI.framework/ZeeCoreABI"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/ZeeCoreABI.framework/ZeeCoreABI"
  # The Chromium host framework has one composition and two identities: the
  # isolated review framework and the normal product framework. Only the Swift
  # compilation conditions differ, so both build from this template.
  ChromiumHostFramework:
    type: framework
    platform: macOS
    sources:
      - path: Documentation/ReleaseNotes.json
        buildPhase: resources
      # The WebKit composition (its entry point and the shell's WebKit host),
      # engine selection and engine-contributed views; the Chromium sources
      # supply their own.
      - path: ZeeShared
        excludes:
          - Resources/ZeeIcon/Sources
          - Resources/ZeeIcon/Validation
          - Infrastructure/Engines/BrowserEngineRegistration+Composition.swift
          - Features/Settings/Components/BrowserEngineExtensionSettingsPane.swift
          - Features/Settings/Components/BrowserEngineRegistration+FeatureFlags.swift
      - path: ZeeMac
        excludes:
          - App/Composition
          - Features/SiteSettings/Components/BrowserEngineSiteSections.swift
      - path: ZeeEngines/Chromium/Apple
        excludes:
          - ZeeChromiumHost.h
    dependencies:
      - target: ZeeDockTilePlugin
        link: false
        embed: false
      - package: Sparkle
        product: Sparkle
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: MediaPlayer.framework
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).chromium-ui"
        PRODUCT_MODULE_NAME: ZeeChromiumUI
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Zee
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ZeeWinter ZeeLion ZeeStorm ZeeDragon ZeeMeadow ZeeIron ZeeRiver ZeeSun ZeeVigil"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ${hostCompilationConditions}
        SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/ZeeEngines/Chromium/Apple/ZeeChromiumHost.h"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/ZeeContracts/include"
        ZEE_CORE_LIBRARY_DIR: "$(BUILT_PRODUCTS_DIR)/ZeeCore"
        OTHER_LDFLAGS: '$(inherited) "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"'
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../../.."
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build portable core
        script: python3 "$SRCROOT/Scripts/control-plane/build-apple-core.py"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"
targets:
  ZeeChromiumUI:
    templates:
      - ChromiumHostFramework
    templateAttributes:
      hostCompilationConditions: "$(inherited) ZEE_CHROMIUM_HOST ZEE_REVIEW_BUILD"
    scheme: {}
  # The normal desktop composition: the same host framework without review
  # isolation, so it uses Zee's persistent store, sync and update identity.
  # It keeps its own product name so a rebuild can never leave one
  # composition's resources inside the other's framework.
  ZeeChromiumUIProduct:
    templates:
      - ChromiumHostFramework
    templateAttributes:
      hostCompilationConditions: "$(inherited) ZEE_CHROMIUM_HOST"
    sources:
      # Names this framework's composition, and becomes the packaged bundle's
      # marker for a host that starts without launch switches.
      - path: ZeeEngines/Chromium/Composition/Zee-Native-Host
        buildPhase: resources
    scheme: {}
  ZeeNativeCore:
    type: application
    platform: macOS
    sources:
      - path: Documentation/ReleaseNotes.json
        buildPhase: resources
      - path: ZeeShared
        excludes:
          - Resources/ZeeIcon/Sources
          - Resources/ZeeIcon/Validation
      - path: ZeeMac
    dependencies:
      - target: ZeeDockTilePlugin
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
          subpath: Contents/Helpers
      - package: Sparkle
        product: Sparkle
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: MediaPlayer.framework
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        ZEE_NATIVE_CORE_ENTITLEMENTS: ZeeNative/Apple/Composition/ControlPlane.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(ZEE_NATIVE_CORE_ENTITLEMENTS)"
        # Release scripts supply the app profile without provisioning bundled plug-ins.
        PROVISIONING_PROFILE_SPECIFIER: "$(ZEE_PROVISIONING_PROFILE_SPECIFIER)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeeMac/Configuration/Zee-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Zee
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ZeeWinter ZeeLion ZeeStorm ZeeDragon ZeeMeadow ZeeIron ZeeRiver ZeeSun ZeeVigil"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ZEE_NATIVE_CORE_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).native-core"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_NATIVE_CORE_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: Zee
        PRODUCT_NAME: ZeeNativeCore
        ZEE_DEFAULT_UPDATE_CHANNEL: development
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ZEE_REVIEW_BUILD"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/ZeeContracts/include"
        ZEE_CORE_LIBRARY_DIR: "$(PROJECT_DIR)/ZeeCore/src/ZeeCore.Native/bin/Release/net10.0/osx-arm64/publish"
        OTHER_LDFLAGS: '$(inherited) "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"'
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
    postBuildScripts:
      - name: Embed portable control plane
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          cp "$ZEE_CORE_LIBRARY_DIR/ZeeCore.Native.dylib" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCore.Native.dylib"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCore.Native.dylib"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(ZEE_CORE_LIBRARY_DIR)/ZeeCore.Native.dylib"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/ZeeCore.Native.dylib"
  ZeeNativeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZeeTests
        includes:
          - BrowserTabStateArchiveTests.swift
          - BrowserDataRetentionTests.swift
          - BrowserWebHostViewTests.swift
          - BrowserPageNavigationMarkerTests.swift
          - BrowserShortcutTests.swift
          - BrowserDurableTabCloseTests.swift
          - BrowserWebsiteDataStoreTests.swift
          - BrowserPagePoolTests.swift
          - BrowserCurrentTabFolderTests.swift
          - BrowserStoreTests.swift
          - BrowserStoreWorkspaceTests.swift
          - BrowserCloudRecordCodecTests.swift
          - BrowserCloudSyncStateTests.swift
          - BrowserLaunchEnvironmentTests.swift
          - BrowserCoreSessionAuthorityTests.swift
          - Support/ZeeCore+ProfileErasure.swift
          - Support/BrowserPage+WebKitTestAccess.swift
          - Support/BrowserPagePool+Presenting.swift
          - Support/BrowserInstalledRelease.swift
          - Support/BrowserPrivacyHTTPServer.swift
          - Support/BrowserStore+Unlocking.swift
          - Support/BrowserStoredSessionHarness.swift
          - Support/StoredSyncJournal.swift
    dependencies:
      - target: ZeeNativeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).native-core.tests"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/ZeeContracts/include"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeeNativeCore.app/Contents/MacOS/ZeeNativeCore"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_EMIT_LOC_STRINGS: NO
  Zee:
    templates: [PortableCoreMac]
    type: application
    platform: macOS
    sources:
      - path: Documentation/ReleaseNotes.json
        buildPhase: resources
      - path: ZeeShared
        excludes:
          - Resources/ZeeIcon/Sources
          - Resources/ZeeIcon/Validation
      - path: ZeeMac
    dependencies:
      - target: ZeeDockTilePlugin
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
          subpath: Contents/Helpers
      - package: Sparkle
        product: Sparkle
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: MediaPlayer.framework
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        ZEE_MAC_ENTITLEMENTS: ZeeMac/Configuration/Zee.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(ZEE_MAC_ENTITLEMENTS)"
        # Release scripts supply the app profile without provisioning bundled plug-ins.
        PROVISIONING_PROFILE_SPECIFIER: "$(ZEE_PROVISIONING_PROFILE_SPECIFIER)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeeMac/Configuration/Zee-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Zee
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ZeeWinter ZeeLion ZeeStorm ZeeDragon ZeeMeadow ZeeIron ZeeRiver ZeeSun ZeeVigil"
        # Zee's ocean blue (sky in dark), so system controls and every
        # accentColor read as Zee rather than the person's system accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ZEE_MAC_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_MAC_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: Zee
        PRODUCT_NAME: "$(ZEE_PRODUCT_NAME)"
        ZEE_DEFAULT_UPDATE_CHANNEL: development
  ZeeDockTilePlugin:
    type: bundle
    platform: macOS
    sources:
      - path: ZeeDockTilePlugin
      - path: ZeeMac/Features/AppIcon/BrowserMacAppIconAssets.swift
      - path: ZeeMac/Features/AppIcon/BrowserMacDockTileView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).docktileplugin"
        PRODUCT_NAME: ZeeDockTilePlugin
        PRODUCT_MODULE_NAME: ZeeDockTilePlugin
        WRAPPER_EXTENSION: docktileplugin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: ZeeDockTilePlugin.ZeeDockTilePlugin
        SKIP_INSTALL: YES
  ZeeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZeeTests
        excludes:
          # Fixtures are read relative to #filePath. Bundling their loose files
          # flattens directories and collides on manifest.json/background.js.
          - Fixtures
    dependencies:
      - target: Zee
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/ZeeContracts/include"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).tests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(ZEE_PRODUCT_NAME).app/Contents/MacOS/$(ZEE_PRODUCT_NAME)"
  ZeeMobileNativeCore:
    type: application
    platform: iOS
    # Scheme BuildableName is derived from productName, not the PRODUCT_NAME
    # build setting. Keep both as Zee so `xcodegen generate` reproduces the
    # committed schemes instead of emitting ZeeMobile.app.
    productName: ZeeNativeCore
    sources:
      - path: Documentation/ReleaseNotes.json
        buildPhase: resources
      - path: ZeeShared
        excludes:
          - Resources/ZeeIcon/Sources
          - Resources/ZeeIcon/Validation
      - path: ZeeMobile
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ZeeNative/Apple/Composition/MobileCloudReview.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeeMobile/Configuration/ZeeMobile-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.1"
        ZEE_MOBILE_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).mobile-native-core"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_MOBILE_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: ZeeMobile
        PRODUCT_NAME: ZeeNativeCore
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Zee
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ZeeWinter ZeeLion ZeeStorm ZeeDragon ZeeMeadow ZeeIron ZeeRiver ZeeSun ZeeVigil"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ZEE_REVIEW_BUILD"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/ZeeContracts/include"
        ZEE_CORE_FRAMEWORK_DIR: "$(PROJECT_DIR)/ZeeCore/artifacts/$(PLATFORM_NAME)"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(ZEE_CORE_FRAMEWORK_DIR)"
        OTHER_LDFLAGS: "$(inherited) -framework ZeeCoreABI"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
    postBuildScripts:
      - name: Embed portable control plane
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          ditto "$ZEE_CORE_FRAMEWORK_DIR/ZeeCoreABI.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCoreABI.framework"
          if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/ZeeCoreABI.framework"
          fi
        inputFiles:
          - "$(ZEE_CORE_FRAMEWORK_DIR)/ZeeCoreABI.framework/ZeeCoreABI"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/ZeeCoreABI.framework/ZeeCoreABI"
  ZeeMobile:
    templates: [PortableCoreMobile]
    type: application
    platform: iOS
    # Scheme BuildableName is derived from productName, not the PRODUCT_NAME
    # build setting. Keep both as Zee so `xcodegen generate` reproduces the
    # committed schemes instead of emitting ZeeMobile.app.
    productName: Zee
    sources:
      - path: Documentation/ReleaseNotes.json
        buildPhase: resources
      - path: ZeeShared
        excludes:
          - Resources/ZeeIcon/Sources
          - Resources/ZeeIcon/Validation
      - path: ZeeMobile
    dependencies:
      - target: ZeeShareExtension
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - sdk: CoreLocation.framework
      - sdk: LocalAuthentication.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ZeeMobile/Configuration/ZeeMobile.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeeMobile/Configuration/ZeeMobile-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.1"
        ZEE_MOBILE_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_MOBILE_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: ZeeMobile
        PRODUCT_NAME: Zee
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Zee
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "ZeeWinter ZeeLion ZeeStorm ZeeDragon ZeeMeadow ZeeIron ZeeRiver ZeeSun ZeeVigil"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The share sheet entry hands shared links to the iOS app. It compiles the
  # hand-off it shares with the app, never the core, which an extension's
  # memory budget cannot hold.
  ZeeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ZeeShareExtension
      - path: ZeeMobile/Infrastructure/BrowserLinkSharing
      - path: ZeeShared/Resources/Localizable.xcstrings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ZeeShareExtension/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.1"
        ZEE_MOBILE_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: $(ZEE_MOBILE_BUNDLE_IDENTIFIER).share
        PRODUCT_MODULE_NAME: ZeeShareExtension
        PRODUCT_NAME: ZeeShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
  ZeeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeeMobileTests
    dependencies:
      - target: ZeeMobile
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/ZeeContracts/include"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(ZEE_BUNDLE_ID).mobile.tests"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Zee.app/Zee"
schemes:
  # The app schemes source Config/Zee.lldbinit, so the debugger never
  # stops on the core runtime's own signals.
  Zee:
    build:
      targets:
        Zee: all
    run:
      customLLDBInit: "$(SRCROOT)/Config/Zee.lldbinit"
    test:
      targets:
        - ZeeTests
  ZeeNativeCore:
    build:
      targets:
        ZeeNativeCore: all
    run:
      customLLDBInit: "$(SRCROOT)/Config/Zee.lldbinit"
    test:
      targets:
        - ZeeNativeCoreTests
  ZeeMobile:
    build:
      targets:
        ZeeMobile: all
    run:
      customLLDBInit: "$(SRCROOT)/Config/Zee.lldbinit"
    test:
      targets:
        - ZeeMobileTests
  ZeeMobileNativeCore:
    build:
      targets:
        ZeeMobileNativeCore: all
    run:
      customLLDBInit: "$(SRCROOT)/Config/Zee.lldbinit"
  ZeeMobile Production:
    build:
      targets:
        ZeeMobile: all
    run:
      config: Release
      customLLDBInit: "$(SRCROOT)/Config/Zee.lldbinit"
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  ZeeKeychainIntegration:
    build:
      targets:
        Zee: all
        ZeeTests: [test]
    test:
      environmentVariables:
        ZEE_RUN_KEYCHAIN_INTEGRATION: "1"
      targets:
        - ZeeTests
